name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore IyuConventions.slnx

    - name: Build
      run: dotnet build IyuConventions.slnx --no-restore --configuration Release

    - name: Test
      # --hangdump/--hangdump-timeout is Microsoft.Testing.Platform's hang guard (Microsoft.Testing.Extensions.HangDump).
      run: dotnet test --solution IyuConventions.slnx --no-build --configuration Release --verbosity normal --hangdump --hangdump-timeout 5m

    - name: Format check
      run: dotnet format IyuConventions.slnx --verify-no-changes

    - name: Pack (verify only)
      run: dotnet pack IyuConventions.slnx --no-build --configuration Release --output ${{ runner.temp }}/pack-verify
